plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

def skijaPlatforms = ['windows-x64', 'windows-arm64', 'linux-x64', 'linux-arm64', 'macos-x64', 'macos-arm64']
def selectedSkijaPlatform = providers.gradleProperty('skijaPlatform').orNull
if (selectedSkijaPlatform != null && !skijaPlatforms.contains(selectedSkijaPlatform)) {
    throw new GradleException("Unknown skijaPlatform '${selectedSkijaPlatform}'. Choose one of: ${skijaPlatforms.join(', ')}")
}
def includedSkijaPlatforms = selectedSkijaPlatform == null ? skijaPlatforms : [selectedSkijaPlatform]

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Bundle Skija's Java API and the native libraries for each supported desktop platform.
    // Include the natives on the development runtime classpath as well.
    implementation include("io.github.humbleui:skija-shared:${project.skija_version}")
    implementation include("io.github.humbleui:types:0.2.0")
    includedSkijaPlatforms.each { platform ->
        runtimeOnly include("io.github.humbleui:skija-${platform}:${project.skija_version}")
    }
}

java {
    withSourcesJar()
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'astatin.refmap.json'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
