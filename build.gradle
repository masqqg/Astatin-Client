plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Skija is bundled (jar-in-jar). The platform artifacts only ship the native
    // libraries; the Java API lives in skija-shared. Every desktop platform is
    // bundled so one jar runs on Windows, Linux and macOS on x64 and arm64.
    implementation include("io.github.humbleui:skija-shared:${project.skija_version}")
    implementation include("io.github.humbleui:types:0.2.0")
    include("io.github.humbleui:skija-windows-x64:${project.skija_version}")
    include("io.github.humbleui:skija-windows-arm64:${project.skija_version}")
    include("io.github.humbleui:skija-linux-x64:${project.skija_version}")
    include("io.github.humbleui:skija-linux-arm64:${project.skija_version}")
    include("io.github.humbleui:skija-macos-x64:${project.skija_version}")
    include("io.github.humbleui:skija-macos-arm64:${project.skija_version}")
}

java {
    withSourcesJar()
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'astatin.refmap.json'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
