name: Build JAR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: ./gradlew build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: astatin-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
